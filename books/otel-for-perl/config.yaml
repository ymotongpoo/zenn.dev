title: "OpenTelemetryのPerl実装にいまこそ必要なもの"
summary: "PerlはOpenTelemetryの公式の対応言語ではありません。それでもCPANにはAPIとSDKがあり、トレースを送れます。小さなPSGIアプリケーションとGoのサービスを用意し、CPANの実装とOpenTelemetry eBPF Instrumentation（OBI）の両方で観測しました。何が動き、どこで止まり、何を直せばよいのかを、動かしたコードと測った値で示します。YAPC::Tokyo 2026の登壇の解説資料です。"
